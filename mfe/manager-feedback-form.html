<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .thank-you-box {
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .thank-you-box h1 {
      color: #0718fa;
   
    }
    .thank-you-box p {
      font-size: 18px;
      color: #333;
    }
    .thank-you-box a {
    margin-top: 5px;
    background: transparent;
    border: 0;
    font-size: 16px;
    font-family: "Mukta-Medium", sans-serif;
    color: #0718fa;
    padding: 12px 30px;
    border: 2px solid #0718fa;
    border-radius: 5px;
    transition: background-color 300ms 
ease-out;
    display: inline-block;
    cursor: pointer;
    outline: none;
    text-align: center;
    position: relative;
    text-decoration: none;
    overflow: hidden;

    }
    .thank-you-box a:hover {

    background: #0718fa;
    color: #ffffff;    }
  </style>
</head>
<body>
  <div class="thank-you-box">
    <h1>Thank you for your interest!</h1>
    <p>The form you’re trying to access is no longer accepting submissions.</p>
    <a href="https://www.resulticks.com/">Home</a>
  </div>
</body>
</html>
